<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Home - PC Parts Store</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <nav>
      <div class="logo">PC PARTS STORE</div>
      <div class="menu">
        <a href="#home">Home</a>
        <a href="#products">Products</a>
        <a href="#about">About</a>
      </div>
    </nav>

    <section id="home" class="hero-section">
      <h1>
        Upgrade PC, Maksimalkan <span class="highlight-text">Performa.</span>
      </h1>
    </section>

    <section id="products">
      <h2>Products</h2>
      <div class="product-container">
        <div class="card">
          <img src="ssd.png" alt="SSD" />
          <p>SSD</p>
        </div>
        <div class="card">
          <img src="ram.jpg" alt="RAM" />
          <p>RAM</p>
        </div>
        <div class="card">
          <img src="cpu.jpg" alt="Prosesor" />
          <p>Prosesor</p>
        </div>
        <div class="card">
          <img src="gpu.png" alt="Kartu Grafis" />
          <p>Kartu Grafis</p>
        </div>
      </div>
    </section>

    <section id="about">
      <h2>About</h2>
      <p>Pilihan komponen untuk kebutuhan upgrade PC kamu.</p>
    </section>
  </body>
</html>
